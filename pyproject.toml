[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentperf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "psutil>=5.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jsonschema>=4.21",
    "rich>=13.7",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
agentperf-replay = "agentperf.replay:main"
agentperf-report = "agentperf.report:main"
agentperf-generate = "traces.synthetic.generator:main"
agentperf-score = "quality.scorer:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
